# Feast odh-feature-server (rhoai-3.5) hermetic RPM lock.
# Match Dockerfiles/Dockerfile.feature-server.konflux runtime microdnf install.
# Use python-312-minimal:latest (not :1) so resolved openssh/crypto-policies
# match the Konflux Dockerfile runtime base.
arches:
  - x86_64
  - ppc64le
  - aarch64

stages:
  - image: registry.access.redhat.com/ubi9/python-312-minimal:latest@sha256:f0f762a4babb280458627ab5cdaafbe86506aa60355c6fd4417074a5aa4727b8
    packages:
      - git
      - libicu
      - libpq
      - python3.12-devel
      - postgresql-devel
      - gcc
      - openblas-devel
